<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Открываем в Chrome</title>
<style>
  /* Страница живёт секунду и своих стилей почти не имеет: она должна
     открыться даже там, где всё остальное ещё не загрузилось. */
  html { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    background: #eceef6;
    color: #0e0e14;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #06060b; color: #fff; }
    a.go { background: #fff; color: #08080e; }
    a.plain { color: #8b8b9c; }
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 14px; opacity: .7; max-width: 22em; }
  a.go {
    margin-top: 6px;
    padding: 12px 22px;
    border-radius: 999px;
    background: #0e0e14;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
  a.plain { font-size: 13px; color: #7c7c88; text-decoration: none; }
</style>
</head>
<body>
<h1>Открываем в Chrome…</h1>
<p>Если ничего не произошло — нажми кнопку.</p>
<a class="go" id="go" href="#">Открыть в Chrome</a>
<a class="plain" id="here" href="#">открыть здесь</a>

<script>
/* Ссылка на кондуит, отправленная в мессенджере, открывается во встроенном
   браузере приложения: там нет ни установки на домашний экран, ни нормального
   кэша, и выглядит всё чужеродно. Эта страница уводит оттуда в Chrome.

   На Android это делается адресом intent:// с указанием пакета браузера; в нём
   же лежит запасной https на случай, если Chrome не установлен. На iPhone у
   Chrome свой протокол googlechromes://, и если он не отзовётся за полсекунды,
   остаёмся здесь же. Во всех прочих случаях просто идём на сайт.

   Адрес нигде не вписан руками: он берётся из того, по которому открыта сама
   страница, — значит, переезд репозитория ничего здесь не сломает. */
(function () {
  var site = location.href.split("#")[0].split("?")[0]
    .replace(/open\.html$/, "");
  var bare = site.replace(/^https?:\/\//, "");
  var ua = navigator.userAgent || "";

  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua);
  // «; wv» помечает встроенный браузер приложения, а не сам Chrome
  var inApp = /;\s*wv\)/i.test(ua) ||
    /(FBAN|FBAV|Instagram|Line\/|MicroMessenger|VKAndroidApp|OKApp)/i.test(ua);
  var isChrome = /Chrome\//.test(ua) &&
    !/(EdgA?|OPR|SamsungBrowser|YaBrowser|MiuiBrowser)/i.test(ua);

  var target = site;
  if (android) {
    target = "intent://" + bare + "#Intent;scheme=https;" +
      "package=com.android.chrome;S.browser_fallback_url=" +
      encodeURIComponent(site) + ";end";
  } else if (ios) {
    target = site.replace(/^https:\/\//, "googlechromes://");
  }

  var go = document.getElementById("go");
  var here = document.getElementById("here");
  go.href = target;
  here.href = site;

  /* Уже в Chrome и не внутри приложения — прыгать некуда, просто открываем. */
  if (!inApp && isChrome) {
    location.replace(site);
    return;
  }

  location.href = target;

  /* На iPhone о неудаче никто не сообщает: если через полсекунды мы всё ещё
     здесь и страница видна, значит Chrome не отозвался — уходим на сайт. */
  if (ios) {
    setTimeout(function () {
      if (!document.hidden) location.replace(site);
    }, 900);
  }
})();
</script>
</body>
</html>
